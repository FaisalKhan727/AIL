<title>Vigilo Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: framed app shell (sidebar + workspace) with the guard app in a phone beside it.
   One committed light theme: the request was for a brighter UI. */
:root {
  color-scheme: light;
  --bg: #f2f5f9;
  --surface: #ffffff;
  --sunken: #f7f9fc;
  --ink: #152033;
  --muted: #5a6880;
  --faint: #8995a8;
  --line: #dde3ec;
  --line-strong: #c6cfdc;
  --accent: #0052ea;
  --accent-ink: #003db0;
  --accent-soft: #e9f0ff;
  --cyan: #0a7fb5;
  --ok: #12764a; --ok-soft: #e4f5ec; --ok-line: #9fd8b9;
  --warn: #a8530a; --warn-soft: #fdf1e1; --warn-line: #f2c48a;
  --bad: #c42727; --bad-soft: #fdeceb; --bad-line: #f1aaa6;
  --crit: #d7193a;
  --info: #0b6aa6; --info-soft: #e5f2fb; --info-line: #9fcde9;
  --violet: #6b3cc0; --violet-soft: #f1ebfc; --violet-line: #cdb8f1;
  --shadow: 0 1px 2px rgb(16 32 64 / 0.06), 0 4px 16px -8px rgb(16 32 64 / 0.12);
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-head); margin: 0; text-wrap: balance; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.ic { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: -3px; }
.ic svg { width: 100%; height: 100%; display: block; }
.ic-lg { width: 20px; height: 20px; }

/* ---------- app frame ---------- */
#app { display: flex; flex-direction: column; gap: 12px; height: 100%; min-height: 0; }
.demobar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.demobar .brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-head); font-weight: 700; font-size: 18px; }
.demobar .tag { font-size: 12px; color: var(--muted); }
.demobar .grow { flex: 1; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.tip { font-size: 12px; color: var(--ink); background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 8px; padding: 6px 10px; }
.tip b { color: var(--accent-ink); }

.stage { flex: 1; min-height: 0; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.stage[data-view="both"] { grid-template-columns: minmax(0, 1fr) 400px; }
.stage[data-view="guard"] .console, .stage[data-view="console"] .phonecol { display: none; }
.stage[data-view="guard"] { justify-items: center; }

.console { min-height: 0; display: grid; grid-template-columns: 220px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.side { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 0 18px; background: var(--surface); }
.side .co { padding: 0 18px 12px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.side .co b { display: block; font-size: 13px; margin-top: 2px; }
.navsec { margin: 8px 0 4px; padding: 0 18px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 6px 14px 6px 15px; border-left: 3px solid transparent; font-size: 13px; color: var(--muted); }
.nav:hover { background: var(--sunken); color: var(--ink); }
.nav[aria-current="page"] { border-left-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.nav .badge { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; border-radius: 4px; padding: 0 5px; line-height: 16px; background: var(--warn-soft); color: var(--warn); }
.nav .badge.red { background: var(--bad-soft); color: var(--bad); }
.nav .badge.cyan { background: var(--info-soft); color: var(--info); }
.main { min-width: 0; overflow-y: auto; padding: 20px 24px 32px; background: var(--bg); }
.mobnav { display: none; margin-bottom: 14px; }

/* ---------- page parts ---------- */
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.ph h1 { font-size: 26px; font-weight: 700; line-height: 1.15; }
.ph p { margin: 4px 0 0; color: var(--muted); max-width: 64ch; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.note { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad); }
.btn.good { color: var(--ok); border-color: var(--ok-line); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn.big { height: 46px; font-size: 15px; justify-content: center; width: 100%; }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; text-align: left; min-width: 0; }
button.tile:hover { border-color: var(--line-strong); }
.tile .v { font-family: var(--font-head); font-weight: 700; font-size: 28px; line-height: 1; margin-top: 8px; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12px; color: var(--muted); margin-top: 6px; }
.tile.warn { border-color: var(--warn-line); } .tile.warn .v { color: var(--warn); }
.tile.bad { border-color: var(--bad-line); } .tile.bad .v { color: var(--crit); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.panel > header h2 { font-family: var(--font-ui); font-size: 13px; font-weight: 600; }
.panel > .body { padding: 14px; }
.grid2 { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-main { display: grid; gap: 14px; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: start; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button { border: 0; background: none; padding: 8px 12px; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--ink); font-weight: 600; }
.count { font-family: var(--font-mono); font-size: 10.5px; background: var(--sunken); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; line-height: 15px; color: var(--muted); }

.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 9px 12px; background: var(--sunken); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--sunken); }
td.r, th.r { text-align: right; }
.empty { padding: 28px; text-align: center; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.02em; text-transform: uppercase; border: 1px solid; border-radius: 4px; padding: 1px 6px; line-height: 16px; white-space: nowrap; }
.t-green { color: var(--ok); background: var(--ok-soft); border-color: var(--ok-line); }
.t-amber { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-line); }
.t-red { color: var(--bad); background: var(--bad-soft); border-color: var(--bad-line); }
.t-crit { color: #fff; background: var(--crit); border-color: var(--crit); }
.t-blue { color: var(--info); background: var(--info-soft); border-color: var(--info-line); }
.t-violet { color: var(--violet); background: var(--violet-soft); border-color: var(--violet-line); }
.t-grey { color: var(--muted); background: var(--sunken); border-color: var(--line); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }
.dot.live { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
.bar { height: 6px; border-radius: 3px; background: var(--sunken); border: 1px solid var(--line); overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--ok); }
.bar.warn > i { background: var(--warn); }
.ok-t { color: var(--ok); } .warn-t { color: var(--warn); } .bad-t { color: var(--crit); }

/* alarms */
.alarm { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
.alarm .top { padding: 12px 14px; }
.alarm .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.alarm .head .t { font-weight: 600; }
.alarm .clock { margin-left: auto; font-family: var(--font-mono); font-size: 13px; }
.alarm .where { font-size: 15px; font-weight: 600; margin: 6px 0; }
.alarm .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.alarm .fold { display: flex; border-top: 1px solid var(--line); }
.alarm .fold button { flex: 1; border: 0; background: none; padding: 7px; font-size: 12px; color: var(--muted); display: inline-flex; justify-content: center; gap: 4px; align-items: center; }
.alarm .fold button[aria-expanded="true"] { background: var(--sunken); color: var(--ink); }
.alarm .more { border-top: 1px solid var(--line); padding: 10px 14px; }
.alarm.crit { animation: flash 1s steps(1) infinite; border-color: var(--crit); }
@keyframes flash { 0%, 49% { background: #fdecef; border-color: var(--crit); } 50%, 100% { background: var(--surface); border-color: #f0a3b0; } }
@media (prefers-reduced-motion: reduce) { .alarm.crit { animation: none; background: #fdecef; } .dot.live { animation: none; } }
.sop label { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; cursor: pointer; }
.sop input { margin-top: 3px; }
.sop .done span { color: var(--muted); text-decoration: line-through; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.tl li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; font-size: 12.5px; }
.tl li .mono { color: var(--muted); }

.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: 46px auto 1fr; gap: 8px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.feed li:last-child { border-bottom: 0; }

/* roster */
.roster { min-width: 860px; }
.roster th, .roster td { vertical-align: top; }
.roster td { padding: 6px; width: 12.5%; }
.roster td.who { font-weight: 500; white-space: nowrap; padding: 10px 12px; width: auto; }
.shift { display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-left: 3px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 5px 7px; margin-bottom: 4px; font-size: 12px; }
.shift .s1 { font-weight: 600; }
.shift.CONFIRMED { border-left-color: var(--ok); }
.shift.PENDING { border-left-color: var(--warn); }
.shift.DRAFT { border-style: dashed; border-left-style: solid; border-left-color: var(--faint); background: var(--sunken); }
.shift.REJECTED { border-left-color: var(--bad); }
.addcell { display: block; width: 100%; border: 1px dashed transparent; background: none; color: transparent; border-radius: 6px; font-size: 12px; padding: 3px; }
.roster td:hover .addcell { border-color: var(--line-strong); color: var(--muted); }
.addcell:focus-visible { color: var(--muted); }

/* charts */
.bars { display: grid; gap: 8px; }
.bars .b { display: grid; grid-template-columns: minmax(0, 9.5rem) 1fr 3.5rem; gap: 10px; align-items: center; font-size: 13px; }
.bars .b span:first-child { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .track { height: 8px; background: var(--sunken); border-radius: 2px; }
.bars .track i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.chart text { font-family: var(--font-mono); font-size: 10px; fill: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; }

/* invoice sheet */
.sheet { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 28px; font-size: 13px; color: #111; }
.sheet table th { background: none; border-bottom: 2px solid #111; color: #333; }
.sheet .tot { margin-left: auto; width: min(260px, 100%); display: grid; gap: 4px; margin-top: 12px; }
.sheet .tot div { display: flex; justify-content: space-between; }
.sheet .tot .grand { border-top: 2px solid #111; padding-top: 6px; font-weight: 700; font-size: 15px; }

/* forms + modal */
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12.5px; font-weight: 500; }
.inp { height: 36px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 10px; background: var(--surface); width: 100%; min-width: 0; }
textarea.inp { height: auto; padding: 8px 10px; resize: vertical; }
.form { display: grid; gap: 12px; }
.form .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; cursor: pointer; }
.check input { margin-top: 3px; }
.scrim { position: fixed; inset: 0; background: rgb(20 32 51 / 0.38); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 50; }
.modal { background: var(--surface); border-radius: 12px; box-shadow: 0 24px 64px -16px rgb(16 32 64 / 0.35); width: min(560px, 100%); max-height: 100%; overflow-y: auto; }
.modal.wide { width: min(880px, 100%); }
.modal > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px 0; }
.modal > header h2 { font-size: 20px; font-weight: 700; }
.modal > header p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.modal > .body { padding: 14px 18px; }
.modal > footer { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--surface); }
.pick { border: 1px solid var(--line); border-radius: 8px; max-height: 240px; overflow-y: auto; }
.pick label { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.pick label:last-child { border-bottom: 0; }
.pick label:has(input:checked) { background: var(--accent-soft); }
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.checks li { display: flex; gap: 8px; font-size: 13px; }
.sq { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; flex: none; margin-top: 1px; }
.sq.y { background: var(--ok-soft); color: var(--ok); } .sq.n { background: var(--warn-soft); color: var(--warn); }
.callout { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--sunken); font-size: 13px; }
.callout.warn { background: var(--warn-soft); border-color: var(--warn-line); color: #6b3606; }
.callout.bad { background: var(--bad-soft); border-color: var(--bad-line); color: #7d1717; }
.callout.ok { background: var(--ok-soft); border-color: var(--ok-line); color: #0b4d30; }
.doccard { aspect-ratio: 1.586; max-width: 100%; border-radius: 10px; border: 1px solid var(--line-strong); background: linear-gradient(135deg, #eef3fb, #dfe8f6); padding: 14px; display: grid; align-content: space-between; color: #2b3a52; }
.doccard .ph1 { width: 64px; height: 76px; border-radius: 4px; background: #c8d3e4; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 60; width: min(360px, calc(100% - 32px)); }
.toast { background: var(--ink); color: #fff; border-radius: 8px; padding: 10px 12px; font-size: 13px; box-shadow: var(--shadow); animation: up 0.18s ease-out; }
.toast small { display: block; color: #c4cede; margin-top: 2px; }
@keyframes up { from { transform: translateY(8px); opacity: 0; } }

/* ---------- guard phone ---------- */
.phonecol { display: grid; align-content: start; justify-items: center; gap: 10px; min-height: 0; }
.phone { width: 380px; max-width: 100%; height: min(780px, 100%); min-height: 560px; border: 10px solid #1d2635; border-radius: 34px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.stage[data-view="guard"] .phone { height: min(820px, calc(100vh - 110px)); }
.phonecol .cap { font-size: 12px; color: var(--muted); text-align: center; max-width: 34ch; }
.g-top { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--line); font-family: var(--font-head); font-weight: 700; font-size: 16px; flex: none; }
.g-top .eyebrow { font-family: var(--font-ui); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.g-body { flex: 1; overflow-y: auto; padding: 14px; display: grid; gap: 12px; align-content: start; }
.g-tabs { display: grid; grid-template-columns: repeat(5, 1fr); height: 58px; background: var(--surface); border-top: 1px solid var(--line); flex: none; }
.g-tabs button { border: 0; border-top: 2px solid transparent; background: none; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 10.5px; color: var(--muted); }
.g-tabs button[aria-current="page"] { border-top-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.g-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 13px; }
.g-card.on { border-color: var(--ok-line); background: #f4fbf7; }
.g-card.disp { animation: flash 1s steps(1) infinite; border-color: var(--crit); }
.g-h { font-family: var(--font-head); font-size: 24px; font-weight: 700; line-height: 1.1; }
.g-big { font-family: var(--font-mono); font-size: 38px; line-height: 1; margin-top: 6px; }
.g-link { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.g-link .grow { flex: 1; min-width: 0; }
.stop { display: grid; grid-template-columns: 24px 1fr; gap: 10px; }
.stop .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; background: var(--sunken); color: var(--muted); }
.stop .n.y { background: var(--ok-soft); color: var(--ok); } .stop .n.x { background: var(--bad-soft); color: var(--bad); }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; cursor: pointer; font-size: 13px; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }

/* ---------- narrow screens ---------- */
@media (max-width: 1279px) { .stage[data-view="both"] { grid-template-columns: minmax(0, 1fr); } .stage[data-view="both"] .phonecol { display: none; } .seg .wideonly { display: none; } }
@media (max-width: 900px) {
  html, body { height: auto; }
  #app { height: auto; }
  .console { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }

function licStatus(l, when = new Date()) {
  if (l.ver === "REJECTED") return "REJECTED";
  const d = l.exp ? Math.round((new Date(l.exp).setHours(0, 0, 0, 0) - new Date(when).setHours(0, 0, 0, 0)) / DAY) : null;
  if (d !== null && d < 0) return "EXPIRED";
  if (l.ver !== "VERIFIED") return "AWAITING";
  if (d === null || d > 60) return "VALID";
  return d <= 14 ? "URGENT" : "EXPIRING";
}
const licLabel = { VALID: "Valid", EXPIRING: "Expiring soon", URGENT: "Urgent", EXPIRED: "Expired", AWAITING: "Awaiting check", REJECTED: "Rejected" };
function clearance(gid, when = new Date()) {
  const ls = S.licences.filter((l) => l.guard === gid);
  const sec = ls.filter((l) => LT[l.type]?.[2]);
  const issues = [];
  let level = "ok";
  const current = sec.filter((l) => ["VALID", "EXPIRING", "URGENT"].includes(licStatus(l, when)));
  if (!sec.length) { level = "block"; issues.push("No security licence on file"); }
  else if (!current.length) {
    level = "block";
    issues.push(sec.some((l) => licStatus(l, when) === "AWAITING") ? "Security licence has not been verified" : "Security licence is expired on the shift date");
  } else {
    const best = Math.max(...current.map((l) => daysTo(l.exp) ?? 9999));
    if (best <= 14) { level = "warn"; issues.push(`Security licence expires in ${best} day${best === 1 ? "" : "s"}`); }
  }
  ls.filter((l) => !LT[l.type]?.[2]).forEach((l) => {
    const st = licStatus(l, when);
    if (st === "EXPIRED") { if (level === "ok") level = "warn"; issues.push(`${LT[l.type][1]} is expired`); }
    if (st === "AWAITING") { if (level === "ok") level = "warn"; issues.push(`${LT[l.type][1]} is awaiting verification`); }
  });
  return { level, issues };
}
const TARGET = { CRITICAL: 5, HIGH: 8, MEDIUM: 15, LOW: 30 };
function sla(a, now = Date.now()) {
  const target = TARGET[a.pri] * MIN;
  const end = a.onScene ? new Date(a.onScene).getTime() : a.resolved ? new Date(a.resolved).getTime() : now;
  const el = Math.max(0, end - new Date(a.trig).getTime());
  return { el, target, state: el > target ? "bad" : el > target * 0.7 ? "warn" : "ok" };
}
function scanned(j) { return Object.values(j.scans).filter((s) => s.st === "SCANNED").length; }
function missed(j) { return Object.values(j.scans).filter((s) => s.st === "MISSED").length; }

}

}

/* ------------------------------------------------------------ alarms */

  return head + tb + `<div class="grid-main"><div>${q.length ? q.map(alarmCard).join("") : `<div class="panel empty">No active alarms. Use “Log alarm” when a monitoring centre or site calls one in.</div>`}</div>
    <section class="panel"><header><h2>Dispatch board</h2></header><div class="body" style="display:grid;gap:12px">${board.length ? board.map((a) => {
      const s = sla(a); return `<div style="display:grid;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)">
        <div class="row" style="justify-content:space-between;align-items:flex-start"><div><b>${esc(gname(a.guard))}</b><div class="small muted">${esc(a.type)} · ${esc(sname(a.site))}</div><div class="mono small" style="color:var(--cyan)">${esc(G(a.guard).phone)}</div></div>

    }).join("") : `<p class="muted" style="margin:0">No guards dispatched.</p>`}</div></section></div>`;

function alarmCard(a) {

  </article>`;
}
const SOP = {
  "Hold-Up Alarm": ["Do NOT call the site. Treat as a live hold-up", "Call police (000) with site, zone and access details", "Hold guards at a safe distance until police direct otherwise", "Notify the client's emergency contact and management", "Preserve CCTV footage", "Record every action taken on this alarm"],
  "Duress/Panic Button": ["Confirm via CCTV. Do NOT call the site directly", "Dispatch the nearest guard immediately", "Notify the shift supervisor", "Call police if there is no response within 5 minutes", "Record every action taken on this alarm"],
  "CCTV Offline": ["Check whether other cameras at the site are online", "Ask the on-site guard to inspect the camera and cabling", "Log a fault with the client's CCTV maintainer", "Increase patrol frequency in the affected zone"],

function alarmHistory() {
  const rows = [...S.history].sort((a, b) => new Date(b.trig) - new Date(a.trig));

  return `<div class="tiles">${tile("Alarms closed", rows.length)}${tile("Avg response", att.length ? (att.reduce((x, y) => x + y, 0) / att.length).toFixed(1) + " min" : "—", "Trigger to guard on scene")}
    ${tile("False alarms", Math.round(((rows.length - gen.length) / Math.max(1, rows.length)) * 100) + "%")}${tile("Within response target", gen.length ? Math.round((within / gen.length) * 100) + "%" : "—", "Genuine alarms only")}</div>` +
    table([["Ref", (a) => `<span class="mono">${ref("ALM", a.ref)}</span>`], ["Triggered", (a) => `<span class="small">${dd(a.trig)} ${hm(a.trig)}</span>`], ["Site", (a) => `${esc(sname(a.site))} <span class="muted">· ${esc(a.zone)}</span>`], ["Type", (a) => esc(a.type)], ["Priority", (a) => pill(a.pri)],

      ["Outcome", (a) => `<span class="small muted">${a.ver === "FALSE_ALARM" ? "False alarm. " : ""}${esc(a.outcome)}</span>`]], rows, "No resolved alarms yet.");

  const t = curTab("comp", queue.length ? "queue" : "registry");
  const licRow = (l) => `data-a="modal" data-m="verify" data-id="${l.id}"`;
  const cols = [["Guard", (l) => `<b>${esc(gname(l.guard))}</b>`], ["Credential", (l) => esc(LT[l.type][1])], ["Number", (l) => `<span class="mono small">${esc(l.number)} <span class="muted">${l.state}</span></span>${l.doc ? ` ${ic("clip")}` : ""}`],
    ["Expires", (l) => { const d = daysTo(l.exp); return `<span class="mono small">${dmy(l.exp)}</span>${d !== null && d <= 60 ? ` <span class="small ${d < 0 || d <= 14 ? "bad-t" : "warn-t"}">${d < 0 ? `${-d} days ago` : `in ${d} days`}</span>` : ""}`; }],
    ["Status", (l) => pill(licStatus(l), licLabel[licStatus(l)])], [t === "queue" ? "Source" : "Checked by", (l) => `<span class="small muted">${t === "queue" ? (l.source === "GUARD" ? "Guard app upload" : "Office entry") : esc(l.by) || "—"}</span>`],

  return ph("Licences &amp; Compliance", "Every credential your guards hold, who checked it, and when it runs out.", `<button class="btn primary" data-a="modal" data-m="addLicence">${ic("plus")}Add licence</button>`) + `
  <div class="tiles">
    <div class="tile" style="grid-column:span 2"><div class="row" style="justify-content:space-between"><span class="eyebrow">Guards cleared to work</span><span class="mono small muted">${ok} of ${cl.length}</span></div>
      <div class="row" style="margin-top:8px;flex-wrap:nowrap"><span class="v ${score < 100 ? "warn-t" : "ok-t"}" style="margin:0">${score}%</span><div class="bar ${score < 100 ? "warn" : ""}" style="flex:1"><i style="width:${score}%"></i></div></div></div>
    ${tile("Valid", st("VALID"))}${tile("Expiring ≤ 60 days", st("EXPIRING"), "", st("EXPIRING") ? "warn" : "")}${tile("Urgent ≤ 14 days", st("URGENT"), "", st("URGENT") ? "bad" : "")}${tile("Expired", st("EXPIRED"), "", st("EXPIRED") ? "bad" : "")}${tile("To verify", queue.length, "", queue.length ? "warn" : "")}
  </div>` + tabs("comp", [["queue", "Verification queue", queue.length], ["registry", "Registry", ls.length], ["guards", "Guard clearance", cl.filter((c) => c.level !== "ok").length]]) +
    (t === "guards"
      ? table([["Guard", (c) => `<b>${esc(c.g.first)} ${esc(c.g.last)}</b>`], ["Rostering", (c) => (c.level === "block" ? pill("REJECTED", "Not cleared") : c.level === "warn" ? pill("PENDING", "Cleared · attention") : pill("CONFIRMED", "Cleared"))], ["What needs doing", (c) => `<span class="small muted">${esc(c.issues.join(" · ")) || "—"}</span>`]],
        cl.sort((a, b) => "block warn ok".indexOf(a.level) - "block warn ok".indexOf(b.level)), "")
      : table(cols, t === "queue" ? queue : [...ls].sort((a, b) => (a.exp ? new Date(a.exp) : Infinity) - (b.exp ? new Date(b.exp) : Infinity)), t === "queue" ? "Nothing waiting. New uploads from the guard app appear here." : "No licences.", licRow));

/* ------------------------------------------------------------ analytics */
function pageAnalytics() {
  const all = [...S.history, ...S.alarms];
  const days = 30;
  const series = [...Array(days)].map((_, i) => { const d = atDay(i - days + 1); return { d, inc: 0, al: 0 }; });
  const idx = (t) => Math.floor((new Date(t).getTime() - atDay(-days + 1).getTime()) / DAY);
  S.incidents.forEach((i) => { const k = idx(i.at); if (series[k]) series[k].inc++; });
  all.forEach((a) => { const k = idx(a.trig); if (series[k]) series[k].al++; });
  const tally = (arr, key) => Object.entries(arr.reduce((m, x) => ((m[key(x)] = (m[key(x)] || 0) + 1), m), {})).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value).slice(0, 6);
  const done = S.jobs.filter((j) => ["COMPLETED", "PARTIAL", "MISSED"].includes(j.status));
  const stops = done.reduce((n, j) => n + RUN(j.run).stops.length, 0), sc = done.reduce((n, j) => n + scanned(j), 0);
  const byRun = S.runs.map((r) => { const js = done.filter((j) => j.run === r.id), st = js.reduce((n, j) => n + r.stops.length, 0); return { label: `${r.code} ${r.name}`, value: st ? Math.round((js.reduce((n, j) => n + scanned(j), 0) / st) * 100) : 0 }; });
  const hrs = (s) => { const [a, b] = [s.start, s.end].map((x) => +x.slice(0, 2)); return (b - a + 24) % 24 || 24; };
  const bySite = Object.entries(S.shifts.filter((s) => s.status === "CONFIRMED").reduce((m, s) => ((m[sname(s.site)] = (m[sname(s.site)] || 0) + hrs(s)), m), {})).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value);
  const att = S.history.filter((a) => a.onScene).map((a) => (new Date(a.onScene) - new Date(a.trig)) / MIN);
  const bars = (data, unit = "") => { const max = Math.max(1, ...data.map((d) => d.value)); return `<div class="bars">${data.map((d) => `<div class="b"><span title="${esc(d.label)}">${esc(d.label)}</span><span class="track"><i style="width:${(d.value / max) * 100}%"></i></span><span class="mono r" style="text-align:right">${d.value}${unit}</span></div>`).join("") || '<p class="muted">No data.</p>'}</div>`; };
  const W = 720, H = 190, PL = 26, PB = 22, PT = 10, max = Math.max(2, ...series.map((s) => Math.max(s.inc, s.al)));
  const X = (i) => PL + (i / (days - 1)) * (W - PL - 10), Y = (v) => PT + (1 - v / max) * (H - PT - PB);
  const path = (k) => series.map((s, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(s[k]).toFixed(1)}`).join("");
  const guardRows = S.guards.map((g) => ({ id: g.id, name: `${g.first} ${g.last}`, shifts: S.shifts.filter((s) => s.guard === g.id && s.status === "CONFIRMED").length, hours: S.shifts.filter((s) => s.guard === g.id && s.status === "CONFIRMED").reduce((n, s) => n + hrs(s), 0), patrols: S.jobs.filter((j) => j.guard === g.id && j.status === "COMPLETED").length, inc: S.incidents.filter((i) => i.guard === g.id).length })).sort((a, b) => b.hours - a.hours);
  return ph("Analytics &amp; Reports", "How the operation performed over the last 30 days, worked out from the records in this demo.") + `
  <div class="tiles">${tile("Incidents", S.incidents.length, `${badges().incidents} still open`)}${tile("Alarms", all.length, `${Math.round((S.history.filter((a) => a.ver === "FALSE_ALARM").length / S.history.length) * 100)}% false`)}
    ${tile("Avg alarm response", (att.reduce((a, b) => a + b, 0) / att.length).toFixed(1) + " min", "Trigger to on scene")}${tile("Patrol completion", Math.round((sc / stops) * 100) + "%", `${done.length} jobs closed`)}
    ${tile("Patrol revenue", money(done.reduce((n, j) => n + billable(j), 0)), "Billable, ex GST")}${tile("Guards cleared", Math.round((S.guards.filter((g) => clearance(g.id).level !== "block").length / S.guards.length) * 100) + "%")}</div>
  <section class="panel" style="margin-bottom:14px"><header><h2>Incidents and alarms per day</h2></header><div class="body">
    <div class="legend"><span><i style="background:var(--accent)"></i>Incidents</span><span><i style="background:var(--warn)"></i>Alarms</span></div>
    <div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px" role="img" aria-label="Incidents and alarms per day over 30 days">
      ${[0, Math.ceil(max / 2), max].map((v) => `<line x1="${PL}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${PL - 6}" y="${Y(v) + 3}" text-anchor="end">${v}</text>`).join("")}
      ${series.map((s, i) => (i % 5 === 0 ? `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${s.d.getDate()}/${s.d.getMonth() + 1}</text>` : "")).join("")}
      <path d="${path("al")}" fill="none" stroke="var(--warn)" stroke-width="2" stroke-linejoin="round"/><path d="${path("inc")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
      ${series.map((s, i) => `<rect x="${X(i) - 6}" y="${PT}" width="12" height="${H - PT - PB}" fill="transparent"><title>${dmy(s.d)}: ${s.inc} incidents, ${s.al} alarms</title></rect>`).join("")}
    </svg></div></div></section>
  <div class="grid2" style="margin-bottom:14px">
    <section class="panel"><header><h2>Incidents by type</h2></header><div class="body">${bars(tally(S.incidents, (i) => i.type))}</div></section>
    <section class="panel"><header><h2>Alarms by type</h2></header><div class="body">${bars(tally(all, (a) => a.type))}</div></section>
    <section class="panel"><header><h2>Guard hours by site (this week)</h2></header><div class="body">${bars(bySite, " h")}</div></section>
    <section class="panel"><header><h2>Patrol completion by run</h2></header><div class="body">${bars(byRun, "%")}</div></section>
  </div>` + table([["Guard", (g) => `<b>${esc(g.name)}</b>`], ["Shifts", (g) => `<span class="mono">${g.shifts}</span>`, "r"], ["Hours", (g) => `<span class="mono">${g.hours}</span>`, "r"], ["Patrol runs completed", (g) => `<span class="mono">${g.patrols}</span>`, "r"], ["Incidents reported", (g) => `<span class="mono">${g.inc}</span>`, "r"]], guardRows, "");
}

/* ------------------------------------------------------------ modals */
function modalFrame(title, sub, body, foot = "", wide = false) {
  return `<div class="scrim" data-a="scrim"><div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ""}</div><button class="btn ghost sm" data-a="close" aria-label="Close">${ic("x")}</button></header>
    <div class="body">${body}</div>${foot ? `<footer>${foot}</footer>` : ""}</div></div>`;
}
const cancel = `<button type="button" class="btn" data-a="close">Cancel</button>`;
const opt = (v, label, sel) => `<option value="${esc(v)}" ${sel === v ? "selected" : ""}>${esc(label)}</option>`;
const field = (id, label, input) => `<div class="field"><label for="${id}">${label}</label>${input}</div>`;

function renderModal() {
  const m = UI.modal;
  if (!m) return "";
  const A = m.id && S.alarms.find((a) => a.id === m.id);
  switch (m.m) {
    case "logAlarm": return `<form data-f="logAlarm">${modalFrame("Log alarm", "From a monitoring centre call, a panel or a site report.", `<div class="form">
      ${field("la-site", "Site", `<select id="la-site" name="site" class="inp" required>${S.sites.map((s) => opt(s.id, s.name)).join("")}</select>`)}
      <div class="two">${field("la-type", "Alarm type", `<select id="la-type" name="type" class="inp">${["Motion Detection", "Door/Window Breach", "Duress/Panic Button", "Glass Break", "Perimeter Breach", "Fire Alarm", "Hold-Up Alarm", "Lone Worker Alert", "Tamper Alert", "CCTV Offline", "Power Failure"].map((t) => opt(t, t)).join("")}</select>`)}
      ${field("la-pri", "Priority", `<select id="la-pri" name="pri" class="inp">${["CRITICAL", "HIGH", "MEDIUM", "LOW"].map((p) => opt(p, p, "HIGH")).join("")}</select>`)}</div>
      ${field("la-zone", "Zone", `<input id="la-zone" name="zone" class="inp" required placeholder="Loading dock, Lobby, Car park L2…">`)}</div>`, cancel + `<button class="btn primary">Log alarm</button>`)}</form>`;
    case "dispatch": {
      const rank = (g) => (S.alarms.some((x) => x.guard === g.id && x.id !== A.id) ? 4 : S.onShift[g.id] === A.site ? 0 : S.onShift[g.id] ? 1 : 3);
      const gs = [...S.guards].sort((a, b) => rank(a) - rank(b));
      return `<form data-f="dispatch" data-id="${A.id}">${modalFrame("Dispatch guard", `${ref("ALM", A.ref)} · ${A.pri} ${esc(A.type)} · ${esc(sname(A.site))}, ${esc(A.zone)}`, `<div class="form">
        <div class="pick">${gs.map((g, i) => `<label><input type="radio" name="guard" value="${g.id}" ${i === 0 ? "checked" : ""}><span style="flex:1"><b>${esc(g.first)} ${esc(g.last)}</b><span class="small muted" style="display:block">${rank(g) === 4 ? "On another alarm" : S.onShift[g.id] === A.site ? "Rostered at this site now" : S.onShift[g.id] ? `On shift · ${esc(sname(S.onShift[g.id]))}` : "Not on shift"}</span></span>${rank(g) === 0 ? pill("CONFIRMED", "Nearest") : rank(g) === 4 ? pill("PENDING", "Busy") : ""}</label>`).join("")}</div>
        <div class="two">${field("d-eta", "ETA (minutes)", `<input id="d-eta" name="eta" class="inp" type="number" min="1" max="240" value="4" required>`)}${field("d-note", "Instructions", `<input id="d-note" name="note" class="inp" placeholder="Enter via Whiteman St">`)}</div>
        <label class="check"><input type="checkbox" name="sms" checked> Text the guard as well as alerting their app</label></div>`, cancel + `<button class="btn primary">Confirm dispatch</button>`)}</form>`;
    }
    case "sms": {
      const body = `VIGILO ALERT: ${A.pri} ${A.type} at ${sname(A.site)}, ${A.zone}. Triggered ${hm(A.trig)}. Ref ${ref("ALM", A.ref)}.`;
      return `<form data-f="sms" data-id="${A.id}">${modalFrame("Send SMS alert", `Tell a third party about ${ref("ALM", A.ref)}. Every message is recorded on the alarm.`, `<div class="form">
        ${field("s-to", "Recipient", `<select id="s-to" name="to" class="inp">${S.contacts.map((c, i) => opt(i, `${c.name} · ${c.phone}`)).join("")}</select>`)}
        ${field("s-body", "Message", `<textarea id="s-body" name="body" class="inp" rows="4" maxlength="480" required>${esc(body)}</textarea>`)}
        <p class="small muted" style="margin:0">In this demo the message is recorded on the alarm but not sent.</p></div>`, cancel + `<button class="btn primary">${ic("send")}Send SMS</button>`)}</form>`;
    }
    case "contacts": return modalFrame("SMS contacts", "People outside the company who can be texted from an alarm.", `<ul class="feed">${S.contacts.map((c) => `<li style="grid-template-columns:1fr auto"><span>${esc(c.name)}</span><span class="mono small">${esc(c.phone)}</span></li>`).join("")}</ul>`, `<button class="btn" data-a="close">Done</button>`);
    case "note": case "resolve": case "falseAlarm": {
      const cfg = { note: ["Add note", "What happened or what was done", "Add note", true], resolve: [`Resolve ${ref("ALM", A.ref)}`, "Outcome: what was found and what was done", "Resolve", true], falseAlarm: ["Mark as false alarm", "Cause, if known", "Mark false alarm", false] }[m.m];
      return `<form data-f="${m.m}" data-id="${A.id}">${modalFrame(cfg[0], m.m === "falseAlarm" ? "Closes the alarm and counts it in the false-alarm rate." : "", `<textarea name="text" class="inp" rows="3" placeholder="${cfg[1]}" ${cfg[3] ? "required" : ""} aria-label="${cfg[1]}"></textarea>`, cancel + `<button class="btn primary">${cfg[2]}</button>`)}</form>`;
    }
    case "incident": {
      const i = S.incidents.find((x) => x.id === m.id);
      return modalFrame(`<span class="mono muted" style="font-size:14px">${ref("INC", i.ref)}</span> ${esc(i.type)}`, `${esc(sname(i.site))}${i.zone ? ` · ${esc(i.zone)}` : ""} · ${dd(i.at)} ${hm(i.at)} · reported by ${i.guard ? esc(gname(i.guard)) : "the office"}`, `
        <div class="grid2"><div style="display:grid;gap:12px;align-content:start">
          <div class="row">${pill(i.sev)}${pill(i.status)}</div>
          <div><div class="eyebrow">Narrative</div><p style="margin:4px 0 0;white-space:pre-wrap">${esc(i.story)}</p></div>
          ${i.persons ? `<div><div class="eyebrow">Persons involved</div><p class="muted" style="margin:4px 0 0">${esc(i.persons)}</p></div>` : ""}
          ${i.loss ? `<div><div class="eyebrow">Estimated loss</div><span class="mono">${money(i.loss)}</span></div>` : ""}
          <div class="two" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${field("i-st", "Status", `<select id="i-st" class="inp" data-c="incStatus" data-id="${i.id}">${["OPEN", "UNDER_REVIEW", "ESCALATED", "RESOLVED", "ARCHIVED"].map((s) => opt(s, LABEL[s] || s[0] + s.slice(1).toLowerCase(), i.status)).join("")}</select>`)}
            ${field("i-who", "Investigator", `<select id="i-who" class="inp" data-c="incWho" data-id="${i.id}">${["", "Rachel Ng", "Jess Morton", "Sam Clarke"].map((w) => opt(w, w || "Unassigned", i.who || "")).join("")}</select>`)}</div></div>
        <div><div class="eyebrow" style="margin-bottom:6px">Timeline</div><ol class="tl" style="max-height:230px;overflow-y:auto">${i.upd.map((u) => `<li style="grid-template-columns:1fr"><span><span class="mono small muted">${dd(u.at)} ${hm(u.at)} · ${esc(u.who)}</span><br>${esc(u.t)}</span></li>`).join("")}</ol>
          <form data-f="incUpdate" data-id="${i.id}" style="display:grid;gap:8px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px"><textarea name="text" class="inp" rows="2" required placeholder="Add an update: action taken, follow-up, outcome" aria-label="Update"></textarea><button class="btn sm primary" style="justify-self:start">Add update</button></form></div></div>`, "", true);
    }
    case "newIncident": return `<form data-f="newIncident">${modalFrame("New incident", "", `<div class="form"><div class="two">
      ${field("n-site", "Site", `<select id="n-site" name="site" class="inp">${S.sites.map((s) => opt(s.id, s.name)).join("")}</select>`)}${field("n-zone", "Zone", `<input id="n-zone" name="zone" class="inp">`)}
      ${field("n-type", "Type", `<select id="n-type" name="type" class="inp">${["Theft", "Trespassing", "Vandalism", "Physical Altercation", "Medical Emergency", "Suspicious Activity", "Property Damage", "Graffiti", "Other"].map((t) => opt(t, t)).join("")}</select>`)}
      ${field("n-sev", "Severity", `<select id="n-sev" name="sev" class="inp">${["CRITICAL", "HIGH", "MEDIUM", "LOW"].map((p) => opt(p, p, "MEDIUM")).join("")}</select>`)}</div>
      ${field("n-story", "What happened", `<textarea id="n-story" name="story" class="inp" rows="4" required minlength="10"></textarea>`)}</div>`, cancel + `<button class="btn primary">Create incident</button>`)}</form>`;
    case "shift": {
      const s = S.shifts.find((x) => x.id === m.id);
      return `<form data-f="shift" data-id="${s.id}">${modalFrame("Shift", `${esc(gname(s.guard))} · ${DOW[atDay(s.day - S.today).getDay()]} ${s.start}–${s.end} · ${esc(sname(s.site))}`, `<div class="form">
        ${field("sh-st", "Status", `<select id="sh-st" name="status" class="inp">${["DRAFT", "PENDING", "CONFIRMED", "REJECTED"].map((v) => opt(v, { DRAFT: "Draft (not sent)", PENDING: "Sent, awaiting reply", CONFIRMED: "Confirmed", REJECTED: "Declined" }[v], s.status)).join("")}</select>`)}</div>`,
        `<button type="button" class="btn ghost danger" data-a="delShift" data-id="${s.id}">Delete shift</button><span style="flex:1"></span>` + cancel + `<button class="btn primary">Save</button>`)}</form>`;
    }
    case "addShift": {
      const day = +m.d;
      return `<form data-f="addShift" data-d="${day}">${modalFrame("Add shift", `${DOW[atDay(day - S.today).getDay()]} ${dmy(atDay(day - S.today))}`, `<div class="form">
        ${field("as-g", "Guard", `<select id="as-g" name="guard" class="inp" data-c="shiftGuard">${S.guards.map((g) => opt(g.id, `${g.first} ${g.last}`, m.g)).join("")}</select>`)}
        <div id="compl">${complCallout(m.g)}</div>
        ${field("as-s", "Site", `<select id="as-s" name="site" class="inp">${S.sites.map((s) => opt(s.id, s.name)).join("")}</select>`)}
        <div class="two">${field("as-a", "Start", `<input id="as-a" name="start" class="inp" type="time" value="18:00" required>`)}${field("as-b", "End", `<input id="as-b" name="end" class="inp" type="time" value="02:00" required>`)}</div>
        ${field("as-r", "Role", `<select id="as-r" name="role" class="inp">${["Static", "Patrol", "Crowd control", "Response", "Supervisor"].map((r) => opt(r, r)).join("")}</select>`)}</div>`, cancel + `<button class="btn primary">Add as draft</button>`)}</form>`;
    }
    case "verify": {
      const l = S.licences.find((x) => x.id === m.id);
      const d = daysTo(l.exp), fmt = /^\d{3}-?\d{3}-?\d{2}[A-Z]$/i.test(l.number);
      const dup = S.licences.some((x) => x.id !== l.id && x.number === l.number && x.guard !== l.guard);
      const checks = [["Number format", fmt, fmt ? "Matches the usual VIC format (###-###-##S)" : "VIC licence numbers are normally ###-###-##S"], ["Expiry date", d === null || d >= 0, d === null ? "Does not expire" : d < 0 ? `Expired ${-d} days ago` : `${d} days remaining`], ["Unique holder", !dup, dup ? "Same number held by another guard" : "Not recorded against another guard"]];
      const st = licStatus(l);
      return modalFrame("Verify licence", `${esc(gname(l.guard))} · ${l.source === "GUARD" ? "Uploaded from the guard app" : "Entered by the office"}`, `<div class="grid2">
        <div style="display:grid;gap:12px;align-content:start">${l.doc ? `<div class="doccard" role="img" aria-label="Sample licence photo"><div class="row" style="justify-content:space-between"><span class="eyebrow">Photo from guard app</span><span class="small">Sample</span></div><div class="row" style="flex-wrap:nowrap;gap:12px"><div class="ph1"></div><div class="small"><b>${esc(gname(l.guard).toUpperCase())}</b><br><span class="mono">${esc(l.number)}</span><br>Expires ${dmy(l.exp)}</div></div></div>` : `<div class="callout">No document on file. Ask the guard to upload one from the app.</div>`}
          <dl style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0"><div><dt class="eyebrow">Credential</dt><dd style="margin:2px 0 0">${esc(LT[l.type][0])}</dd></div><div><dt class="eyebrow">Number</dt><dd class="mono" style="margin:2px 0 0">${esc(l.number)} · ${l.state}</dd></div>
          <div><dt class="eyebrow">Expires</dt><dd style="margin:2px 0 0">${dmy(l.exp)}</dd></div><div><dt class="eyebrow">Status</dt><dd style="margin:2px 0 0">${pill(st, licLabel[st])}</dd></div></dl></div>
        <div style="display:grid;gap:12px;align-content:start"><div><div class="eyebrow" style="margin-bottom:6px">Automatic checks</div><ul class="checks">${checks.map(([a, ok, t]) => `<li><span class="sq ${ok ? "y" : "n"}">${ic(ok ? "check" : "x")}</span><span><b>${a}.</b> <span class="muted">${t}</span></span></li>`).join("")}</ul></div>
          <div class="callout"><div class="eyebrow">Manual register check</div>Confirm this licence with Victoria Police Licensing &amp; Regulation Division, then record the outcome.</div>
          ${st === "AWAITING" ? `<label class="check"><input type="checkbox" id="attest" data-c="attest"> I checked this licence with the regulator. The holder's name, number, class and expiry match.</label>
          ${field("v-note", "Note", `<textarea id="v-note" class="inp" rows="2" placeholder="Required when rejecting. Sent to the guard."></textarea>`)}` : `<div class="callout ok">Checked by ${esc(l.by || "the office")}.</div>`}</div></div>`,
        st === "AWAITING" ? `<button class="btn danger" data-a="lic" data-op="reject" data-id="${l.id}">Reject</button><button class="btn primary" id="verifyBtn" data-a="lic" data-op="verify" data-id="${l.id}" disabled>${ic("check")}Mark verified</button>` : `<button class="btn" data-a="close">Close</button>`, true);
    }
    case "addLicence": return `<form data-f="addLicence">${modalFrame("Add licence", "New licences start unverified until someone checks them.", `<div class="form">
      ${field("al-g", "Guard", `<select id="al-g" name="guard" class="inp">${S.guards.map((g) => opt(g.id, `${g.first} ${g.last}`)).join("")}</select>`)}
      ${field("al-t", "Credential", `<select id="al-t" name="type" class="inp">${Object.entries(LT).map(([k, v]) => opt(k, v[0])).join("")}</select>`)}
      <div class="two">${field("al-n", "Number", `<input id="al-n" name="number" class="inp mono" required placeholder="###-###-##S">`)}${field("al-e", "Expires", `<input id="al-e" name="exp" class="inp" type="date" required>`)}</div></div>`, cancel + `<button class="btn primary">Add licence</button>`)}</form>`;
    case "assign": {
      const c = S.courses.find((x) => x.id === m.id);
      const have = new Set(S.enrollments.filter((e) => e.course === c.id).map((e) => e.guard));
      return `<form data-f="assign" data-id="${c.id}">${modalFrame("Assign course", esc(c.title), `<div class="form"><div class="pick">${S.guards.map((g) => `<label><input type="checkbox" name="g" value="${g.id}" ${have.has(g.id) ? "disabled checked" : ""}><span style="flex:1">${esc(g.first)} ${esc(g.last)}</span>${have.has(g.id) ? '<span class="small muted">Already assigned</span>' : ""}</label>`).join("")}</div>
        ${field("as-due", "Complete by", `<input id="as-due" name="due" class="inp" type="date">`)}<label class="check"><input type="checkbox" name="sms" checked> Text each guard that it has been assigned</label></div>`, cancel + `<button class="btn primary">Assign</button>`)}</form>`;
    }
    case "job": {
      const j = S.jobs.find((x) => x.id === m.id), r = RUN(j.run), v = S.vehicles.find((x) => x.id === r.vehicle);
      return modalFrame(`<span class="mono">${r.code}</span> ${esc(r.name)}`, `${dmy(jobDate(j))} · ${esc(CLIENT(r.client).name)} · ${v.code} (${v.rego}) · ${esc(gname(j.guard))}`, `
        <div class="row" style="margin-bottom:10px">${pill(j.status)}<span class="grow"></span><span class="small">Billable <b class="mono">${money(billable(j))}</b> <span class="muted">of ${money(r.rate)}</span></span></div>
        <div class="tablewrap"><table><tbody>${r.stops.map((s, i) => { const sc = j.scans[s.id]; return `<tr><td class="mono muted" style="width:28px">${i + 1}</td><td><b>${esc(s.name)}</b><div class="small muted">${esc(s.addr)}</div>${sc?.note ? `<div class="small warn-t">${esc(sc.note)}</div>` : ""}</td><td class="r">${sc ? pill(sc.st === "SCANNED" ? "COMPLETED" : "MISSED", sc.st === "SCANNED" ? "Attended" : "Missed") + `<div class="mono small muted">${hm(sc.at)}</div>` : pill("SCHEDULED", "Pending")}</td></tr>`; }).join("")}</tbody></table></div>`, `<button class="btn" data-a="close">Close</button>`);
    }
    case "run": {
      const r = RUN(m.id);
      return modalFrame(`<span class="mono">${r.code}</span> ${esc(r.name)}`, `Billed to ${esc(CLIENT(r.client).name)} at ${money(r.rate)} per completed run`, `<ol class="tl">${r.stops.map((s, i) => `<li style="grid-template-columns:24px 1fr"><span class="mono">${i + 1}</span><span><b>${esc(s.name)}</b> <span class="muted">· ${esc(s.addr)}</span>${s.note ? `<br><span class="small">${esc(s.note)}</span>` : ""}</span></li>`).join("")}</ol>`, `<button class="btn" data-a="close">Close</button>`);
    }
    case "builder": {
      const cid = m.client || "c1";
      const avail = S.jobs.filter((j) => !j.invoice && ["COMPLETED", "PARTIAL"].includes(j.status) && RUN(j.run).client === cid).sort((a, b) => a.day - b.day);
      const sub = avail.reduce((n, j) => n + billable(j), 0);
      return `<form data-f="builder" data-client="${cid}">${modalFrame("New invoice", "Finished patrol runs that haven't been billed are pulled in automatically.", `<div class="form">
        ${field("b-c", "Client", `<select id="b-c" class="inp" data-c="builderClient">${S.clients.map((c) => opt(c.id, c.name, cid)).join("")}</select>`)}
        <div class="tablewrap"><table><thead><tr><th></th><th>Date</th><th>Run</th><th>Stops</th><th class="r">Amount</th></tr></thead><tbody>${avail.length ? avail.map((j) => `<tr><td><input type="checkbox" name="j" value="${j.id}" checked data-c="builderSum" aria-label="Include ${RUN(j.run).code} ${dmy(jobDate(j))}"></td><td class="mono small">${dmy(jobDate(j))}</td><td><b class="mono">${RUN(j.run).code}</b> <span class="muted">${esc(RUN(j.run).name)}</span></td><td class="mono small">${scanned(j)}/${RUN(j.run).stops.length}${j.status === "PARTIAL" ? ' <span class="warn-t">partial</span>' : ""}</td><td class="r mono" data-amt="${billable(j)}">${money(billable(j))}</td></tr>`).join("") : `<tr><td colspan="5" class="empty">No unbilled patrol runs for this client.</td></tr>`}</tbody></table></div>
        <div class="two">${field("b-x", "Extra charge (optional)", `<input id="b-x" name="extra" class="inp" placeholder="Alarm call-out fee">`)}${field("b-xa", "Amount ($)", `<input id="b-xa" name="extraAmt" class="inp" type="number" step="0.01" data-c="builderSum">`)}</div>
        <div id="btot" style="display:grid;gap:4px;justify-self:end;min-width:220px">${totalsHtml(sub)}</div></div>`, cancel + `<button class="btn primary">Save as draft</button>`, true)}</form>`;
    }
    case "invoice": {
      const inv = S.invoices.find((x) => x.id === m.id), c = CLIENT(inv.client), t = invTotals(inv), st = invStatus(inv);
      return modalFrame(`${ref("INV", inv.num)}`, `${esc(c.name)} · ${pill(st)}`, `<div class="sheet">
        <div class="row" style="justify-content:space-between;align-items:flex-start"><div><div style="font-family:var(--font-head);font-size:22px;font-weight:700">${esc(S.company)}</div><div class="eyebrow" style="color:#555">Tax invoice</div></div><div style="text-align:right"><div class="mono" style="font-size:18px;font-weight:600">${ref("INV", inv.num)}</div>${st === "DRAFT" ? '<div class="eyebrow">Draft, not issued</div>' : ""}${st === "PAID" ? '<div class="eyebrow ok-t">Paid</div>' : ""}</div></div>
        <div class="row" style="justify-content:space-between;align-items:flex-start;margin-top:18px"><div><div class="eyebrow" style="color:#555">Bill to</div><b>${esc(c.name)}</b><div>Attn: ${esc(c.contact)}</div></div><div class="small" style="text-align:right">Period ${dmy(inv.from)} – ${dmy(inv.to)}<br>Issued ${dmy(inv.issued)}<br>Due ${inv.due ? dmy(inv.due) : `${c.terms} days from issue`}</div></div>
        <div style="overflow-x:auto;margin-top:16px"><table><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Unit</th><th class="r">Amount</th></tr></thead><tbody>${invLines(inv).map((l) => `<tr><td>${esc(l.d)}</td><td class="r mono">${l.q}</td><td class="r mono">${money(l.u)}</td><td class="r mono">${money(l.q * l.u)}</td></tr>`).join("")}</tbody></table></div>
        <div class="tot"><div><span>Subtotal</span><span class="mono">${money(t.sub)}</span></div><div><span>GST 10%</span><span class="mono">${money(t.gst)}</span></div><div class="grand"><span>Total AUD</span><span class="mono">${money(t.total)}</span></div></div></div>`,
        (inv.status === "DRAFT" ? `<button class="btn danger" data-a="inv" data-op="void" data-id="${inv.id}">Void</button><button class="btn primary" data-a="inv" data-op="send" data-id="${inv.id}">Mark as sent</button>` : "") +
        (inv.status === "SENT" ? `<button class="btn" data-a="inv" data-op="remind" data-id="${inv.id}">Send SMS reminder</button><button class="btn primary" data-a="inv" data-op="paid" data-id="${inv.id}">Mark paid</button>` : "") + (["PAID", "VOID"].includes(inv.status) ? `<button class="btn" data-a="close">Close</button>` : ""), true);
    }
    case "addClient": return `<form data-f="addClient">${modalFrame("Add client", "", `<div class="form">${field("c-n", "Client name", `<input id="c-n" name="name" class="inp" required>`)}
      <div class="two">${field("c-c", "Contact", `<input id="c-c" name="contact" class="inp">`)}${field("c-p", "Phone", `<input id="c-p" name="phone" class="inp" type="tel">`)}
      ${field("c-t", "Payment terms (days)", `<input id="c-t" name="terms" class="inp" type="number" value="14">`)}${field("c-s", "SLA: alarm response (mins)", `<input id="c-s" name="sla" class="inp" type="number" value="10">`)}</div></div>`, cancel + `<button class="btn primary">Add client</button>`)}</form>`;
    case "jobReq": return `<form data-f="jobReq">${modalFrame("New job request", "Ask a subcontractor to supply guards.", `<div class="form">
      ${field("j-s", "Subcontractor", `<select id="j-s" name="sub" class="inp">${S.subs.filter((s) => s.status === "ACTIVE").map((s) => opt(s.id, s.name)).join("")}</select>`)}
      ${field("j-d", "What you need", `<input id="j-d" name="desc" class="inp" required placeholder="2 crowd controllers for Friday night">`)}

const ACT = {
  view: (d) => { UI.view = d.v; if (d.v === "guard") history.replaceState(null, "", "#guard-app"); else history.replaceState(null, "", "#" + UI.route); render(); },
  reset: () => { S = seed(); UI.modal = null; UI.tab = {}; UI.fold = {}; render(); toast("Demo reset", "Sample data restored."); },
  go: (d) => go(d.r),
  tab: (d) => { UI.tab[d.k] = d.v; render(); },
  fold: (d) => { UI.fold[d.id] = UI.fold[d.id] === d.v ? null : d.v; render(); },
  modal: (d) => { UI.modal = { ...d }; render(); setTimeout(() => document.querySelector(".modal input:not([type=hidden]):not([type=radio]):not([type=checkbox]), .modal textarea, .modal select")?.focus(), 0); },
  close: () => { UI.modal = null; render(); },
  scrim: (d, el, e) => { if (e.target === el) ACT.close(); },
  alarm: (d) => {
    const a = S.alarms.find((x) => x.id === d.id);
    if (d.op === "escalate") { const order = ["CRITICAL", "HIGH", "MEDIUM", "LOW"], i = order.indexOf(a.pri); alarmLog(a, "You", `Escalated ${a.pri} → ${order[i - 1]}`); a.pri = order[i - 1]; toast("Escalated", `${ref("ALM", a.ref)} is now ${a.pri}`); }
    if (d.op === "onscene") { a.status = "ON_SCENE"; a.onScene = new Date(); alarmLog(a, "You", "Guard on scene (set by operator)"); toast("Marked on scene"); }
    if (d.op === "recall") { alarmLog(a, "You", `Recalled ${gname(a.guard)}`); toast("Guard recalled", gname(a.guard)); a.guard = null; a.status = "UNASSIGNED"; a.eta = null; a.onScene = null; }
    render();
  },
  publish: () => { const n = S.shifts.filter((s) => s.status === "DRAFT"); n.forEach((s) => (s.status = "PENDING")); log("SMS", `Published ${n.length} shifts for confirmation`); toast(`${n.length} shifts published`, "Guards confirm by SMS reply or in the app. (Demo: nothing sent.)"); render(); },
  delShift: (d) => { S.shifts = S.shifts.filter((s) => s.id !== d.id); UI.modal = null; toast("Shift deleted"); render(); },
  lic: (d) => {
    const l = S.licences.find((x) => x.id === d.id), note = document.getElementById("v-note")?.value.trim();
    if (d.op === "reject") { if (!note || note.length < 3) { toast("Add a reason", "The guard is told why the licence was rejected."); document.getElementById("v-note")?.focus(); return; } l.ver = "REJECTED"; l.note = note; l.by = "You"; toast("Licence rejected", `${gname(l.guard)} is told why.`); }
    else { l.ver = "VERIFIED"; l.by = "You"; log("LICENCE", `${gname(l.guard)}'s ${LT[l.type][1]} verified`); toast("Licence verified", `${gname(l.guard)} · ${LT[l.type][1]}`); }
    UI.modal = null; render();
  },
  inv: (d) => {
    const inv = S.invoices.find((x) => x.id === d.id), c = CLIENT(inv.client);
    if (d.op === "send") { inv.status = "SENT"; inv.issued = new Date(); inv.due = new Date(Date.now() + c.terms * DAY); toast(`${ref("INV", inv.num)} marked as sent`, `Due ${dmy(inv.due)}`); }
    if (d.op === "paid") { inv.status = "PAID"; inv.paid = new Date(); log("INVOICE", `${ref("INV", inv.num)} paid by ${c.name}`); toast(`${ref("INV", inv.num)} marked paid`); }
    if (d.op === "remind") toast("Reminder recorded", `${c.contact}, ${c.phone}. (Demo: nothing sent.)`);
    if (d.op === "void") { inv.status = "VOID"; S.jobs.forEach((j) => { if (j.invoice === inv.id) j.invoice = null; }); toast(`${ref("INV", inv.num)} voided`, "Its patrol runs can be billed again."); }
    render();
  },
  subinv: (d) => { const i = S.subInv.find((x) => x.id === d.id); i.status = d.v; toast(`Invoice ${i.num}: ${d.v.toLowerCase()}`); render(); },
  // guard app
  gpage: (d) => { const M = me(); M.page = d.p; if (d.p === "patrol") M.jobId = d.id; if (d.p === "course") { M.courseId = d.id; M.quiz = false; M.lastScore = null; } M.missing = null; render(); const g = document.getElementById("gbody"); if (g) g.scrollTop = 0; },
  clock: (d) => { const sh = me().shift; if (d.op === "in") { sh.in = new Date(); log("SHIFT", `Liam Nguyen clocked in at ${sname(sh.site)}`); toast("Clocked in", `${sname(sh.site)} · location recorded`); } else { sh.out = new Date(); log("SHIFT", `Liam Nguyen clocked out at ${sname(sh.site)}`); toast("Clocked out", "Added to your timesheet"); } render(); },
  gshift: (d) => { const p = me().pending; p.status = d.op === "confirm" ? "CONFIRMED" : "REJECTED"; const s = S.shifts.find((x) => x.guard === "g1" && x.day === S.today + 1); if (s) s.status = p.status; log("SHIFT", `Liam Nguyen ${d.op === "confirm" ? "confirmed" : "declined"} ${dd(p.start)}`); toast(d.op === "confirm" ? "Shift confirmed" : "Shift declined", dd(p.start)); render(); },
  gal: (d) => {
    const a = S.alarms.find((x) => x.id === d.id);
    if (d.op === "enroute") { a.status = "EN_ROUTE"; alarmLog(a, "Liam Nguyen", "Acknowledged, en route"); log("DISPATCH", `Liam Nguyen en route to ${ref("ALM", a.ref)}`); toast("Control room told: en route"); }
    else { a.status = "ON_SCENE"; a.onScene = new Date(); if (a.ver === "UNVERIFIED") a.ver = "GUARD_CONFIRMED"; alarmLog(a, "Liam Nguyen", "On scene"); log("DISPATCH", `Liam Nguyen on scene at ${sname(a.site)}`); toast("Control room told: on scene"); }
    render();
  },
  gscan: (d) => { const j = S.jobs.find((x) => x.id === me().jobId); j.scans[d.id] = { st: "SCANNED", at: new Date(), note: "" }; log("PATROL", `Liam Nguyen checked in at ${RUN(j.run).stops.find((s) => s.id === d.id).name}`); render(); },
  gmiss: (d) => { me().missing = d.id; render(); document.querySelector('[data-f="gMiss"] input')?.focus(); },
  gmissCancel: () => { me().missing = null; render(); },
  gfinish: () => {
    const j = S.jobs.find((x) => x.id === me().jobId), r = RUN(j.run);
    const open = r.stops.filter((s) => !j.scans[s.id]).length;
    if (open) { toast(`${open} stop${open === 1 ? " is" : "s are"} still open`, "Check in or mark each one missed with a reason."); return; }
    const sc = scanned(j); j.status = sc === r.stops.length ? "COMPLETED" : sc ? "PARTIAL" : "MISSED"; log("PATROL", `${r.code} closed ${j.status.toLowerCase()}: ${sc}/${r.stops.length} stops, ${money(billable(j))} billable`); toast("Patrol finished", `${sc}/${r.stops.length} stops · ${money(billable(j))} billable`); render();
  },
  gquiz: () => {
    const M = me(), e = S.enrollments.find((x) => x.id === M.courseId), c = S.courses.find((x) => x.id === e.course);
    if (!c.qs.length) { Object.assign(e, { status: "PASSED", score: 100, done: new Date() }); toast("Course completed"); } else { M.quiz = true; }
    render(); document.getElementById("gbody").scrollTop = 0;
  },
  gaddlic: () => { me().addingLic = !me().addingLic; render(); },
  gsignout: () => { Object.assign(me(), { signedIn: false, step: "phone", page: "today" }); render(); },
};
const FORM = {
  logAlarm: (f) => { const a = { id: uid("a"), ref: Math.max(...S.alarms.map((x) => x.ref), 4012) + 1, site: f.site, zone: f.zone, type: f.type, pri: f.pri, ver: "UNVERIFIED", status: "UNASSIGNED", guard: null, eta: null, trig: new Date(), onScene: null, sop: [], tl: [{ at: new Date(), who: "You", t: "Alarm logged" }] }; S.alarms.push(a); log("ALARM", `${a.type} at ${sname(a.site)}, ${a.zone}`); toast("Alarm logged", `${ref("ALM", a.ref)} · ${a.pri}`); UI.modal = null; UI.tab.alarms = "active"; },
  dispatch: (f, form) => { const a = S.alarms.find((x) => x.id === form.dataset.id); a.guard = f.guard; a.eta = +f.eta; a.status = "DISPATCHED"; a.onScene = null; alarmLog(a, "You", `Dispatched ${gname(f.guard)}, ETA ${f.eta} min${f.sms ? " (SMS + app)" : " (app)"}${f.note ? ` — ${f.note}` : ""}`); log("DISPATCH", `${gname(f.guard)} dispatched to ${ref("ALM", a.ref)}, ETA ${f.eta} min`); toast("Guard dispatched", `${gname(f.guard)} · ETA ${f.eta} min${f.guard === "g1" ? " · now open the guard app" : ""}`); UI.modal = null; },
  sms: (f, form) => { const a = S.alarms.find((x) => x.id === form.dataset.id), c = S.contacts[+f.to]; alarmLog(a, "You", `SMS to ${c.name} (${c.phone}): ${f.body}`); log("SMS", `Alarm alert recorded for ${c.name}`); toast("SMS recorded on the alarm", `${c.name}. (Demo: nothing sent.)`); UI.modal = null; },
  note: (f, form) => { const a = S.alarms.find((x) => x.id === form.dataset.id); alarmLog(a, "You", f.text); toast("Note added"); UI.modal = null; UI.fold[a.id] = "tl"; },
  resolve: (f, form) => closeAlarm(form.dataset.id, f.text, false),
  falseAlarm: (f, form) => closeAlarm(form.dataset.id, f.text || "False alarm", true),
  incUpdate: (f, form) => { const i = S.incidents.find((x) => x.id === form.dataset.id); i.upd.push({ at: new Date(), who: "You", t: f.text }); toast("Update added"); },
  newIncident: (f) => { const i = { id: uid("i"), ref: Math.max(...S.incidents.map((x) => x.ref)) + 1, site: f.site, type: f.type, sev: f.sev, status: "OPEN", zone: f.zone, guard: null, at: new Date(), who: null, story: f.story, upd: [{ at: new Date(), who: "You", t: "Incident logged by the office" }] }; S.incidents.unshift(i); log("INCIDENT", `${i.type} logged at ${sname(i.site)}`); toast("Incident created", ref("INC", i.ref)); UI.modal = null; },
  shift: (f, form) => { const s = S.shifts.find((x) => x.id === form.dataset.id); s.status = f.status; toast("Shift updated"); UI.modal = null; },
  addShift: (f, form) => { S.shifts.push({ id: uid("s"), guard: f.guard, site: f.site, day: +form.dataset.d, start: f.start, end: f.end, role: f.role, status: "DRAFT" }); const c = clearance(f.guard); toast("Draft shift added", c.level === "block" ? `Warning: ${gname(f.guard)} is not cleared to work` : "Publish when the week is ready"); UI.modal = null; },
  addLicence: (f) => { S.licences.push({ id: uid("l"), guard: f.guard, type: f.type, number: f.number, state: "VIC", exp: new Date(f.exp), ver: "UNVERIFIED", source: "ADMIN" }); toast("Licence added", "It's in the verification queue"); UI.modal = null; UI.tab.comp = "queue"; },
  assign: (f, form) => { const gs = [...form.querySelectorAll('input[name="g"]:checked:not(:disabled)')].map((x) => x.value); if (!gs.length) { toast("Pick at least one guard"); return false; } gs.forEach((g) => S.enrollments.push({ id: uid("en"), course: form.dataset.id, guard: g, status: "ASSIGNED", due: f.due ? new Date(f.due) : null })); toast(`Assigned to ${gs.length} guard${gs.length === 1 ? "" : "s"}`, f.sms ? "Each was texted. (Demo: nothing sent.)" : ""); UI.modal = null; },
  builder: (f, form) => {
    const ids = [...form.querySelectorAll('input[name="j"]:checked')].map((x) => x.value);
    const extra = f.extra && f.extraAmt ? [{ d: f.extra, q: 1, u: +f.extraAmt }] : [];
    if (!ids.length && !extra.length) { toast("Nothing to bill", "Tick at least one run or add a charge."); return false; }
    const inv = { id: uid("n"), num: Math.max(...S.invoices.map((x) => x.num)) + 1, client: form.dataset.client, from: atDay(-14), to: atDay(0), status: "DRAFT", issued: null, due: null, lines: null, extra };
    ids.forEach((id) => (S.jobs.find((j) => j.id === id).invoice = inv.id));
    if (extra.length) inv.lines = [...S.jobs.filter((j) => j.invoice === inv.id).map((j) => ({ d: `${dmy(jobDate(j))} — ${RUN(j.run).code} ${RUN(j.run).name}${j.status === "PARTIAL" ? " (partial)" : ""}`, q: 1, u: billable(j) })), ...extra];
    S.invoices.push(inv); toast("Draft invoice created", ref("INV", inv.num)); UI.modal = { m: "invoice", id: inv.id };
  },
  addClient: (f) => { S.clients.push({ id: uid("c"), name: f.name, contact: f.contact || "—", phone: f.phone || "—", terms: +f.terms || 14, slaPatrol: 95, slaAlarm: +f.sla || 10, end: atDay(365) }); toast("Client added", f.name); UI.modal = null; },
  jobReq: (f) => { S.jobReqs.unshift({ id: uid("jr"), sub: f.sub, site: f.site, desc: f.desc, from: atDay(3), to: atDay(4), heads: +f.heads, status: "PENDING" }); toast("Job request sent", S.subs.find((s) => s.id === f.sub).name); UI.modal = null; UI.tab.subs = "requests"; },
  // guard app
  gPhone: () => { me().step = "code"; toast("Code sent", "Demo: use 482913"); render(); setTimeout(() => document.getElementById("gc")?.focus(), 0); return false; },
  gCode: (f) => { if (f.code.trim() !== "482913") { document.getElementById("codeErr").textContent = "That code is wrong. Use 482913."; return false; } Object.assign(me(), { signedIn: true, page: "today" }); },
  gStart: (f, form) => { const j = S.jobs.find((x) => x.id === me().jobId), r = RUN(j.run), v = S.vehicles.find((x) => x.id === r.vehicle); const ok = new Set([...form.querySelectorAll('input[name="ok"]:checked')].map((x) => x.value)); const failed = ["Exterior condition", "Tyres", "Lights and indicators", "First aid kit present", "Fire extinguisher present", "Radio / device charged"].filter((x) => !ok.has(x)); j.status = "ACTIVE"; j.started = new Date(); v.odo = +f.odo || v.odo; S.checks.push({ id: uid("vc"), vehicle: v.id, guard: "g1", at: new Date(), odo: v.odo, fuel: f.fuel, failed, notes: "" }); log("PATROL", `${r.code} started by Liam Nguyen`); toast("Patrol started", failed.length ? `Vehicle check: ${failed.length} item failed` : "Vehicle check passed"); },
  gMiss: (f, form) => { const j = S.jobs.find((x) => x.id === me().jobId); j.scans[form.dataset.id] = { st: "MISSED", at: new Date(), note: f.why }; me().missing = null; },
  gIncident: (f) => { const i = { id: uid("i"), ref: Math.max(...S.incidents.map((x) => x.ref)) + 1, site: f.site, type: f.type, sev: f.sev, status: "OPEN", zone: f.zone, guard: "g1", at: new Date(), who: null, story: f.story, upd: [{ at: new Date(), who: "Liam Nguyen", t: "Reported from the guard app" }] }; S.incidents.unshift(i); log("INCIDENT", `${i.type} reported at ${sname(i.site)} by Liam Nguyen`); toast("Incident reported", `${ref("INC", i.ref)} is with the control room`); me().page = "tasks"; },
  gQuiz: (f) => { const M = me(), e = S.enrollments.find((x) => x.id === M.courseId), c = S.courses.find((x) => x.id === e.course); const right = c.qs.filter((q, i) => +f["q" + i] === q.a).length; const score = Math.round((right / c.qs.length) * 100); e.attempts = (e.attempts || 0) + 1; e.score = score; if (score >= c.pass) { Object.assign(e, { status: "PASSED", done: new Date(), exp: c.renew ? atDay(c.renew * 30) : null }); log("TRAINING", `Liam Nguyen passed ${c.title} (${score}%)`); toast("Course passed", `${score}%`); } else { e.status = "FAILED"; M.lastScore = score; toast("Not passed yet", `${score}%. Pass mark ${c.pass}%.`); } M.quiz = false; },
  gLic: (f) => { S.licences.push({ id: uid("l"), guard: "g1", type: f.type, number: f.number, state: "VIC", exp: new Date(f.exp), ver: "UNVERIFIED", source: "GUARD", doc: true }); me().addingLic = false; log("LICENCE", `Liam Nguyen uploaded a ${LT[f.type][1]}`); toast("Sent to the office", "It's now in the console's verification queue"); },
};
function closeAlarm(id, outcome, isFalse) {
  const a = S.alarms.find((x) => x.id === id);
  S.alarms = S.alarms.filter((x) => x.id !== id);
  S.history.unshift({ ...a, status: "RESOLVED", ver: isFalse ? "FALSE_ALARM" : a.ver, resolved: new Date(), by: "You", outcome, sms: a.tl.some((e) => e.t.startsWith("SMS to")) });
  log("ALARM", `${ref("ALM", a.ref)} ${isFalse ? "closed as false alarm" : "resolved"}`);
  toast(isFalse ? "Closed as false alarm" : "Alarm resolved", ref("ALM", a.ref));
  UI.modal = null;
}
const CHANGE = {
  go: (el) => go(el.value),
  ver: (el) => { const a = S.alarms.find((x) => x.id === el.dataset.id); a.ver = el.value; alarmLog(a, "You", `Verification: ${(LABEL[el.value] || "unverified").toLowerCase()}`); render(); },
  sop: (el) => { const a = S.alarms.find((x) => x.id === el.dataset.id), i = +el.dataset.i; a.sop = el.checked ? [...a.sop, i] : a.sop.filter((n) => n !== i); alarmLog(a, "You", `Procedure ${el.checked ? "done" : "unticked"}: ${(SOP[a.type] || SOP.default)[i]}`); render(); },
  incStatus: (el) => { const i = S.incidents.find((x) => x.id === el.dataset.id); i.upd.push({ at: new Date(), who: "You", t: `Status: ${LABEL[i.status] || i.status.toLowerCase()} → ${LABEL[el.value] || el.value.toLowerCase()}` }); i.status = el.value; toast("Status updated"); render(); },
  incWho: (el) => { const i = S.incidents.find((x) => x.id === el.dataset.id); i.who = el.value || null; i.upd.push({ at: new Date(), who: "You", t: el.value ? `Assigned to ${el.value}` : "Unassigned" }); render(); },
  shiftGuard: (el) => { document.getElementById("compl").innerHTML = complCallout(el.value); },
  attest: (el) => { document.getElementById("verifyBtn").disabled = !el.checked; },
  builderClient: (el) => { UI.modal.client = el.value; render(); },
  builderSum: () => { const f = document.querySelector('[data-f="builder"]'); const sub = [...f.querySelectorAll('input[name="j"]:checked')].reduce((n, x) => n + +x.closest("tr").querySelector("[data-amt]").dataset.amt, 0) + (+f.querySelector('[name="extraAmt"]').value || 0); document.getElementById("btot").innerHTML = totalsHtml(sub); },
  gphoto: (el) => { const n = el.files?.[0]?.name; document.getElementById("gphoto").textContent = n ? `Photo attached: ${n}` : "Add a photo (optional)"; },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.a];
  if (fn) { if (el.tagName === "A") e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener("change", (e) => { const el = e.target.closest("[data-c]"); if (el && CHANGE[el.dataset.c]) CHANGE[el.dataset.c](el); });
document.addEventListener("input", (e) => { const el = e.target.closest('[data-c="builderSum"]'); if (el) CHANGE.builderSum(); });
document.addEventListener("submit", (e) => {
  const form = e.target.closest("[data-f]");
  if (!form) return;
  e.preventDefault();
  const fd = new FormData(form), f = {};
  for (const [k, v] of fd.entries()) f[k] = v;
  if (FORM[form.dataset.f](f, form) !== false) render();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && UI.modal) ACT.close(); });

// Live clocks: alarm timers, SLA countdowns and the guard's on-shift timer.
setInterval(() => {
  document.querySelectorAll("[data-clock]").forEach((el) => {
    const a = S.alarms.find((x) => x.id === el.dataset.clock); if (!a) return;
    const s = sla(a); el.textContent = (a.onScene ? "on scene in " : "") + elapsed(s.el); el.className = `clock ${s.state}-t`;
  });
  document.querySelectorAll("[data-left]").forEach((el) => {
    const a = S.alarms.find((x) => x.id === el.dataset.left); if (!a) return;
    const s = sla(a); el.textContent = s.state === "bad" ? "SLA breached" : `${elapsed(s.target - s.el)} left`; el.className = `mono small ${s.state}-t`;
  });
  const on = document.querySelector("[data-onshift]");
  if (on && me().shift.in) on.textContent = clockHMS(Date.now() - new Date(me().shift.in));
}, 1000);

function fromHash() {
  const h = location.hash.slice(1);
  if (h === "guard-app") UI.view = "guard";
  else if (PAGES[h]) UI.route = h;
}
window.addEventListener("hashchange", () => { fromHash(); render(); });
fromHash();
render();
</script>
